<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hub Paroquial Santa Suzana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5ebe0 0%, #e8ddd0 100%);
    }
    
    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full flex-grow flex items-center">
    <div class="w-full">
      <!-- Logo and Back Button -->
      <div class="text-center mb-8">
        <!-- Alterado href de "/" para "index.html" para voltar ao arquivo index.html na mesma pasta -->
        <a href="index.html" class="inline-flex items-center text-[#dc143c] hover:text-[#b01030] mb-4 transition-colors">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          Voltar ao site
        </a>
        <img src="icone-menu.png" alt="Paróquia Santa Suzana" class="h-20 mx-auto mb-4">
        <h1 class="text-3xl font-light mb-2">Bem-vindo de Volta</h1>
        <p class="text-gray-600">Entre no Hub Paroquial</p>
      </div>

      <!-- Login Form -->
      <div class="bg-white rounded-2xl shadow-xl p-8">
        <form id="loginForm" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium mb-2">E-mail</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#dc143c]"
                   placeholder="seu@email.com">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium mb-2">Senha</label>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#dc143c]"
                   placeholder="Sua senha">
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input type="checkbox" id="remember" name="remember"
                     class="w-4 h-4 text-[#dc143c] border-gray-300 rounded focus:ring-[#dc143c]">
              <label for="remember" class="ml-2 text-sm text-gray-700">Lembrar-me</label>
            </div>
            <a href="#" class="text-sm text-[#dc143c] hover:underline">Esqueceu a senha?</a>
          </div>

          <button type="submit" 
                  class="w-full bg-[#dc143c] text-white py-4 rounded-lg font-semibold hover:bg-[#b01030] transition-all transform hover:scale-105 shadow-lg">
            Entrar
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-sm text-gray-600">
            Ainda não tem uma conta? 
            <a href="cadastro.html" class="text-[#dc143c] font-semibold hover:underline">Criar conta</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Added footer with copyright information -->
  <footer class="w-full py-6 mt-8">
    <div class="max-w-4xl mx-auto text-center">
      <p class="text-sm text-gray-600">
        © 2025 Raphael Costa. Todos os direitos reservados. Criado para o site da Paróquia Santa Suzana
      </p>
    </div>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Simulate login
      alert('Login realizado com sucesso! Redirecionando para o Hub...');
      window.location.href = 'hub.html';
    });
  </script>
</body>
</html>
