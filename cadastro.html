<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Hub Paroquial Santa Suzana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5ebe0 0%, #e8ddd0 100%);
    }
    
    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Fixed flex layout by removing flex-grow and restructuring body -->
  <div class="flex-1 flex flex-col items-center justify-center p-4">
    <!-- Logo and Back Button -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center text-[#dc143c] hover:text-[#b01030] mb-4 transition-colors">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Voltar ao site
      </a>
      <img src="icone-menu.png" alt="Paróquia Santa Suzana" class="h-20 mx-auto mb-4">
      <h1 class="text-3xl font-light mb-2">Criar Conta</h1>
      <p class="text-gray-600">Junte-se à nossa comunidade digital</p>
    </div>

    <!-- Signup Form -->
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
      <form id="signupForm" class="space-y-5">
        <div>
          <label for="fullName" class="block text-sm font-medium mb-2">Nome Completo</label>
          <input type="text" id="fullName" name="fullName" required
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#dc143c]"
                 placeholder="Seu nome completo">
        </div>

        <div>
          <label for="email" class="block text-sm font-medium mb-2">E-mail</label>
          <input type="email" id="email" name="email" required
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#dc143c]"
                 placeholder="seu@email.com">
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium mb-2">Telefone</label>
          <input type="tel" id="phone" name="phone" required
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#dc143c]"
                 placeholder="(00) 00000-0000">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium mb-2">Senha</label>
          <input type="password" id="password" name="password" required
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#dc143c]"
                 placeholder="Mínimo 8 caracteres">
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium mb-2">Confirmar Senha</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#dc143c]"
                 placeholder="Digite a senha novamente">
        </div>

        <div class="flex items-start">
          <input type="checkbox" id="terms" name="terms" required
                 class="mt-1 mr-3 w-4 h-4 text-[#dc143c] border-gray-300 rounded focus:ring-[#dc143c]">
          <label for="terms" class="text-sm text-gray-700">
            Concordo com os <a href="#" class="text-[#dc143c] hover:underline">termos de uso</a> e 
            <a href="#" class="text-[#dc143c] hover:underline">política de privacidade</a>
          </label>
        </div>

        <button type="submit" 
                class="w-full bg-[#dc143c] text-white py-4 rounded-lg font-semibold hover:bg-[#b01030] transition-all transform hover:scale-105 shadow-lg">
          Criar Conta
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Já tem uma conta? 
          <a href="login.html" class="text-[#dc143c] font-semibold hover:underline">Entrar</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="w-full py-6 px-4">
    <div class="max-w-4xl mx-auto text-center">
      <p class="text-sm text-gray-600">
        © 2025 Raphael Costa. Todos os direitos reservados. Criado para o site da Paróquia Santa Suzana
      </p>
    </div>
  </footer>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (password !== confirmPassword) {
        alert('As senhas não coincidem!');
        return;
      }
      
      if (password.length < 8) {
        alert('A senha deve ter no mínimo 8 caracteres!');
        return;
      }
      
      // Simulate account creation
      alert('Conta criada com sucesso! Redirecionando para o login...');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
